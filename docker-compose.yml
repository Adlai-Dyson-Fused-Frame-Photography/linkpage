services:
  linkpage:
    image: ghcr.io/Adlai-Dyson-Fused-Frame-Photography/linkpage:latest
    container_name: linkpage
    restart: unless-stopped
    ports:
      - "XXXX:3000"      # replace XXXX with a port of your choice.
    volumes:
      - ./linkpage/data:/data       # this can be customised to your liking.
    environment:
      TZ: ${TZ:-Europe/London}    # used for scheduled links
      TRUST_PROXY: true   # leave as true if using a proxy such as Cloudflare Tunnels
    security_opt: ["no-new-privileges:true"]
    read_only: true               # the app only writes to /data and /tmp
    tmpfs: ["/tmp"]
    
    # On first run, check the container logs for the setup code, then visit http://YOUR-SERVER-IP:CHOSENPORT/setup
    # Then set up the admin user and configure your page.